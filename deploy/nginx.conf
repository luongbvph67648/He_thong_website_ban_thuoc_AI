# Phục vụ bản build frontend và chuyển /api tới backend. Chỉ nginx được công khai, cổng 8000 của api không mở ra ngoài.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Backend tự giới hạn từng loại tệp (ảnh 5 MB, video đổi trả 30 MB x 8 tệp); nginx chỉ cần không chặn trước.
    client_max_body_size 250m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        # Ghi đè chứ không nối thêm: backend dùng IP này để giới hạn tần suất, không được để client tự đặt
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        # WebSocket chat dược sĩ (/api/v1/tu-van/ws) và SSE chatbot (không đệm để chữ chảy ra từng đoạn)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}
