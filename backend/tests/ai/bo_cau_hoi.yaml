# Bộ câu hỏi đánh giá chatbot (spec 07 mục 8). Chạy: uv run python -m app.ai.danh_gia (tốn phí, cần khóa).
# Kỳ vọng kiểm được bằng code: y_dinh, nguy_hiem, khong_goi_y_loai, phai_de_nghi_duoc_si, phai_co_san_pham (chuỗi con của tên).
# Hai nhóm kê đơn và nguy hiểm phải đạt 100%. Tên sản phẩm lấy từ dữ liệu mẫu (python -m app.seed --mau).
