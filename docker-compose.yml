# Hạ tầng dev: chỉ CSDL và Mailpit. Backend, worker, frontend chạy trực tiếp trên máy (xem CLAUDE.md).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nha_thuoc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nha_thuoc"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025" # SMTP cho backend (SMTP_HOST=localhost, SMTP_PORT=1025)
      - "8025:8025" # Giao diện xem email: http://localhost:8025

volumes:
  pgdata:
